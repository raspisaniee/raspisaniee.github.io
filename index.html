<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <title>ЛГТУ - Учебный семестр</title>
  <style>
    :root{--bg:#171717;--panel:#242424;--panel-2:#303030;--line:#414141;--text:#e9e9e9;--muted:#949494;--accent:#ff5b45;--green:#98d75a;--violet:#9b89ef}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;overflow:hidden}button,a{font:inherit;color:inherit}.tabs{height:54px;display:grid;grid-template-columns:repeat(2,1fr);background:#1d1d1d;border-top:4px solid #3b3b3b;border-bottom:1px solid #343434}.tab{position:relative;border:0;background:transparent;color:#949494;font-family:Georgia,serif;font-size:16px;cursor:pointer}.tab:hover{color:#d7d7d7}.tab.active{color:#fff;background:#050505}.tab.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#fff}.view{display:none;height:calc(100vh - 54px)}.view.active{display:block}.map-view{overflow:auto;background:#151515;padding:24px}.map-wrap{width:min(1180px,100%);margin:0 auto}.map-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:18px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;color:#858585;font-size:10px}.map-head h1{font:400 clamp(30px,4vw,54px)/1 Georgia,serif;margin:8px 0 0}.legend{display:flex;gap:16px;color:#aaa;font-size:12px}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}.legend .current{background:var(--green)}.legend .next{background:var(--violet)}.route{display:grid;grid-template-columns:1fr 48px 1fr;align-items:stretch;margin-bottom:16px}.route-card{min-height:116px;border:1px solid #3e3e3e;background:#222;border-radius:9px;padding:17px;display:flex;flex-direction:column}.route-card.current{border-top:4px solid var(--green)}.route-card.next{border-top:4px solid var(--violet)}.route-card small{text-transform:uppercase;letter-spacing:.1em;color:#858585;font-size:9px}.route-card strong{font:600 17px Georgia,serif;margin:8px 0 16px}.route-card div{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-top:auto}.route-card b{font-size:19px}.route-card span{font-size:11px;color:#9b9b9b}.arrow{display:grid;place-items:center;color:#777;font-size:22px}.campus{position:relative;border:1px solid #404040;border-radius:8px;overflow:hidden;background:#eae5d7;box-shadow:0 18px 55px #0008}.campus img{display:block;width:100%;height:auto}.hotspot{position:absolute;border:2px solid transparent;border-radius:5px;pointer-events:none;transition:.2s}.hotspot.current{border-color:#5c9526;background:#9de05255;box-shadow:0 0 0 5px #9de05255,0 0 25px #8ed043}.hotspot.next{border-color:#7d6ed3;background:#9b89ef44;box-shadow:0 0 0 5px #9b89ef44,0 0 25px #9b89ef}.pin{position:absolute;right:-10px;padding:5px 8px;border-radius:99px;color:#111;font-size:11px;font-weight:800;white-space:nowrap}.current .pin{top:-13px;background:var(--green)}.next .pin{bottom:-13px;background:var(--violet)}.b4{left:8.2%;top:35%;width:18.1%;height:15%}.b5{left:3.6%;top:57.3%;width:11.2%;height:36%}.b3{left:28.1%;top:60%;width:9%;height:20.5%}.b1{left:44.4%;top:43.3%;width:11%;height:32.8%}.baud{left:58.7%;top:37.1%;width:10.3%;height:20.8%}.b2{left:72.6%;top:43.4%;width:10.7%;height:31.5%}.b9{left:88.1%;top:43.4%;width:9.8%;height:36%}.bsport{left:36.5%;top:77.1%;width:10.2%;height:15.8%}.badmin{left:58.8%;top:67.8%;width:10.5%;height:16%}.floor-row{display:grid;grid-template-columns:160px 1fr;margin-top:15px;background:#222;border:1px solid #3b3b3b;border-radius:8px;padding:15px;gap:18px;align-items:center}.floor-row strong{display:block;font:400 20px Georgia,serif;margin-top:6px}.floors{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.floor{min-height:55px;border:1px solid #414141;border-radius:5px;color:#777;padding:8px}.floor b{display:block;font:400 19px Georgia,serif}.floor small{font-size:8px}.floor.active-current{background:var(--green);border-color:var(--green);color:#111}.floor.active-next{border-color:var(--violet);color:#fff;box-shadow:inset 0 0 0 1px var(--violet)}@media(max-width:700px){.tabs{height:50px}.tab{font-size:14px}.view{height:calc(100vh - 50px)}.map-view{padding:13px}.map-head{align-items:start;flex-direction:column}.route{grid-template-columns:1fr}.arrow{height:32px;transform:rotate(90deg)}.floor-row{grid-template-columns:1fr}.floors{overflow-x:auto;grid-template-columns:repeat(5,minmax(70px,1fr))}}
  </style>
  <link rel="stylesheet" href="schedule.css">
</head>
<body>
  <nav class="tabs" aria-label="Разделы">
    <button class="tab active" data-tab="schedule">Расписание</button>
    <button class="tab" data-tab="map">Карта</button>
  </nav>

  <main class="view active card-schedule" id="schedule">
    <div class="schedule-app">
      <header class="schedule-app-head">
        <div>
          <span class="group-badge" id="groupBadge">т9-ИП-23-1</span>
          <h1>Моё расписание</h1>
          <p id="selectedDateLabel"></p>
        </div>
        <div class="week-toggle" aria-label="Выбор недели">
          <button class="week-button active" type="button" data-week="white"><i></i>Белая</button>
          <button class="week-button" type="button" data-week="green"><i></i>Зелёная</button>
        </div>
      </header>

      <section class="now-strip" id="nowStrip" aria-live="polite"></section>
      <nav class="day-switcher" id="daySwitcher" aria-label="День недели"></nav>
      <section class="lesson-cards" id="lessonCards" aria-live="polite"></section>
    </div>
  </main>

  <main class="view map-view" id="map">
    <div class="map-wrap">
      <header class="map-head"><div><span class="eyebrow">ЛГТУ · маршрут между парами</span><h1>Где следующая аудитория</h1></div><div class="legend"><span><i class="current"></i>текущая</span><span><i class="next"></i>следующая</span></div></header>
      <section class="route" id="route"></section>
      <section class="campus" id="campus">
        <img src="campus-map.jpg" alt="Схема расположения корпусов и кабинетов">
      </section>
      <section id="floorRows"></section>
    </div>
  </main>

  <script src="schedule-data.js"></script>
  <script src="schedule.js"></script>
  <script>
    const tabs=document.querySelectorAll('.tab'),views=document.querySelectorAll('.view');
    function openTab(id){tabs.forEach(t=>t.classList.toggle('active',t.dataset.tab===id));views.forEach(v=>v.classList.toggle('active',v.id===id));history.replaceState(null,'','#'+id)}
    tabs.forEach(tab=>tab.addEventListener('click',()=>openTab(tab.dataset.tab)));
    const requested=location.hash.slice(1);if(['schedule','map'].includes(requested))openTab(requested);else openTab('schedule');

    function roomLocation(room){const clean=room.toLowerCase();if(clean.includes('спорт'))return{building:'sport',floor:1,label:'Спорткомплекс'};const pref=clean.match(/^(\d)[-–](\d{3})$/);if(pref)return{building:pref[1],floor:Number(pref[2][0]),label:pref[1]+' корпус'};const number=Number((clean.match(/\d{3}/)||[])[0]);if(!number)return{building:'unknown',floor:null,label:'Корпус не определён'};const inside=r=>r.some(([a,b])=>number>=a&&number<=b);let building='unknown';if(inside([[100,111],[204,239],[309,346],[408,440]]))building='1';else if(inside([[112,115],[240,263],[347,382],[441,478]]))building='2';else if(inside([[117,121],[264,272]]))building='3';else if(inside([[122,130],[273,282]]))building='4';else if(inside([[131,146],[283,299],[383,399],[479,499],[504,514]]))building='5';return{building,floor:Number(String(number)[0]),label:building==='unknown'?'Корпус не определён':building+' корпус'}}
    const currentLesson=window.SCHEDULE_ROUTE.current,nextLesson=window.SCHEDULE_ROUTE.next;
    const route=document.getElementById('route'),campus=document.getElementById('campus'),floorRows=document.getElementById('floorRows');
    function card(item,type,label){if(!item)return`<article class="route-card ${type}"><small>${label}</small><strong>—</strong></article>`;const loc=roomLocation(item.room);return`<article class="route-card ${type}"><small>${label} · ${item.time}</small><strong>${item.title}</strong><div><b>ауд. ${item.room}</b><span>${loc.label}${loc.floor?' · '+loc.floor+' этаж':''}</span></div></article>`}
    route.innerHTML=card(currentLesson,'current','Текущая')+'<div class="arrow">→</div>'+card(nextLesson,'next','Следующая');
    const hotspotClass={1:'b1',2:'b2',3:'b3',4:'b4',5:'b5',9:'b9',aud:'baud',sport:'bsport',admin:'badmin'};
    function addHotspot(item,type){if(!item)return;const loc=roomLocation(item.room),cls=hotspotClass[loc.building];if(!cls)return;const el=document.createElement('div');el.className=`hotspot ${cls} ${type}`;el.innerHTML=`<span class="pin">${item.room}</span>`;campus.appendChild(el)}
    const currentLocation=currentLesson&&roomLocation(currentLesson.room),nextLocation=nextLesson&&roomLocation(nextLesson.room);
    const sameBuilding=currentLocation&&nextLocation&&currentLocation.building!=='unknown'&&currentLocation.building===nextLocation.building;
    if(sameBuilding){const el=document.createElement('div');el.className=`hotspot ${hotspotClass[currentLocation.building]} combined`;el.innerHTML=`<span class="pin current-pin">${currentLesson.room}</span><span class="pin next-pin">${nextLesson.room}</span>`;campus.appendChild(el)}else{addHotspot(currentLesson,'current');addHotspot(nextLesson,'next')}
    function floorRow(item,type,label){if(!item)return'';const loc=roomLocation(item.room);if(!loc.floor)return'';return`<div class="floor-row"><div><span class="eyebrow">${label}</span><strong>${loc.label}</strong></div><div class="floors">${[1,2,3,4,5].map(f=>`<div class="floor ${f===loc.floor?'active-'+type:''}"><b>${f}</b><small>${f===loc.floor?'ауд. '+item.room:''}</small></div>`).join('')}</div></div>`}
    floorRows.innerHTML=floorRow(currentLesson,'current','текущая аудитория')+floorRow(nextLesson,'next','следующая аудитория');
  </script>
</body>
</html>
